name: Deploy to github pages
on:
  repository_dispatch:
    types: deploy
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/gh-pages-deploy.yml'
      - 'site/scripts/build*.sh'
      - 'site/scripts/gh-pages-deploy.sh'
      - 'site/scripts/*release.py'
  push:
    branches: [master, staging]
concurrency:
  group: site-deploy-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
jobs:
  snapshot:
    name: Pin release data
    runs-on: ubuntu-latest
    outputs:
      data-sha: ${{ steps.data.outputs.sha }}
    steps:
      - name: Resolve data snapshot
        id: data
        run: |
          SHA=$(git ls-remote https://github.com/quacs/quacs-data.git refs/heads/master | cut -f1)
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
  build:
    name: Build semester batch ${{ matrix.partition }}
    needs: snapshot
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        partition: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: yarn
          cache-dependency-path: site/yarn.lock
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.86.0'
          cache-workspaces: site/src/quacs-rs
          cache-key: release-${{ matrix.partition }}
      - name: Checkout pinned data
        uses: actions/checkout@v4
        with:
          repository: quacs/quacs-data
          ref: ${{ needs.snapshot.outputs.data-sha }}
          path: site/src/store/data
      - name: Install dependencies
        working-directory: site
        run: yarn install --frozen-lockfile
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build isolated semester batch
        working-directory: site
        env:
          QUACS_DATA_SHA: ${{ needs.snapshot.outputs.data-sha }}
          PARTITION: ${{ matrix.partition }}
        run: |
          ACTION=build
          if [ "$GITHUB_REF_NAME" = staging ]; then ACTION=debug-build; fi
          yarn "$ACTION" -a -p "$PARTITION" -c 6 -o release-site
      - name: Upload semester batch
        uses: actions/upload-artifact@v4
        with:
          name: semester-batch-${{ matrix.partition }}
          path: site/release-site/
          if-no-files-found: error
          retention-days: 1
  gh-pages-deploy:
    name: Publish complete release
    runs-on: ubuntu-latest
    needs: [snapshot, build]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout site repo
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: quacs/site
          ref: master
          path: site/gh-pages-site
          token: ${{ secrets.QUACS_TOKEN }}
      - name: Checkout pinned data for validation
        uses: actions/checkout@v4
        with:
          repository: quacs/quacs-data
          ref: ${{ needs.snapshot.outputs.data-sha }}
          path: site/src/store/data
      - name: Assemble semester batches
        uses: actions/download-artifact@v4
        with:
          pattern: semester-batch-*
          merge-multiple: true
          path: site/release-site
      - name: Validate complete release
        working-directory: site
        run: python3 scripts/validate_release.py src/store/data/semester_data release-site
      - name: Publish release
        if: github.event_name != 'pull_request'
        working-directory: site
        env:
          PREBUILT_SITE: release-site
        run: |
          git -C gh-pages-site config user.name "QuACS"
          git -C gh-pages-site config user.email "github@quacs.org"
          sh scripts/gh-pages-deploy.sh
  update-meta:
    name: Update meta
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [gh-pages-deploy]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: meta
      - name: Update meta.json
        run: |
          echo -n \{\"last_deployed\":\"$(date --iso-8601=seconds -u)\"\} > meta.json
      - name: Push meta.json
        run: |
          git config user.name "QuACS"
          git config user.email "github@quacs.org"
          git add meta.json
          git commit -m "$(date)" || exit 0
          git push
